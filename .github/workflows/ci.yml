name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The base branch is main, enforced rather than asked.
      #
      # TRAPS.md's own "a stacked PR is only safe while its base is
      # unmerged" trap. A PR based on another branch merges into THAT
      # branch. GitHub retargets it when the base lands on main, but
      # only if it gets there first, and twice in ubiquex it did not:
      # the dependent PR merged into an already-dead base seconds
      # later, showed MERGED, and its content never reached main.
      #
      # stale-base-check (where this org has it) asks the narrower
      # question, whether the base is ALREADY merged, and it is a real
      # guard. It cannot catch this shape though: it triggers on
      # pull_request opened/synchronize/reopened, so it evaluates when
      # the PR is pushed and never at the moment the merge button is
      # clicked, which is the one moment the trap fires. A PR opened
      # while its base was healthy stays green through the base
      # merging out from under it.
      #
      # This question does not depend on when it is asked. The base is
      # main or it is not, and that cannot change between opening and
      # merging except by retargeting, which only moves it toward main.
      #
      # It lives inside a job branch protection already requires, so a
      # stacked PR cannot merge rather than merely being discouraged,
      # and no branch-protection change was needed to add it.
      - name: The base branch is main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "main" ]; then
            echo "base is main"
            exit 0
          fi
          {
            echo "This PR targets \"$BASE\", not main."
            echo
            echo "A PR based on another branch merges into THAT branch. If the base"
            echo "reaches main first, this PR merges into a dead branch, reports MERGED,"
            echo "and its content never lands. Nothing tells that apart from a real merge"
            echo "except an explicit ancestry check after the fact."
            echo
            echo "Branch from main and open this against main. If it genuinely depends on"
            echo "unmerged work, wait for that to land and rebase onto main:"
            echo
            echo "    git rebase --onto main <old-base> <this-branch>"
            echo
            echo "If a non-main base is ever genuinely right in this repo, change this step"
            echo "deliberately, in its own reviewed PR, rather than working around it."
          } >&2
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm test` builds first via pretest, because the interaction tests
      # import dist/ rather than src/: they exercise what consumers
      # actually install, the same choice the "use client" check below
      # already makes.
      - name: No component carries a specific site's identity
        # Mechanical, because the per-component read-through that
        # preceded it caught GlobalSearch and missed Footer and
        # MobileSidebarToggle. See test/no-site-identity.test.mjs.
        run: npm test
      - run: npm run build
      - name: The published tarball is consumable
        # typecheck and build prove the source compiles. They say
        # nothing about whether what reaches npm can be imported.
        # files/main/types/exports are four hand-maintained claims
        # tsc never validates, and this package is the shared
        # dependency of two sites, so getting one wrong breaks both
        # at once and cannot be fixed by reverting: a published
        # version is immutable.
        run: node scripts/check-package.mjs
      - name: Confirm "use client" survives compilation
        # tsc has historically moved or dropped leading directives. If it
        # does, the client components silently become server components
        # and every consuming site breaks at runtime rather than at build
        # time, which is the worst place to find out.
        #
        # The list is DERIVED from src/ rather than hardcoded. It used to
        # name three components, and deleting one of them failed this
        # step for a component that no longer existed. The same hardcoding
        # would have silently skipped a NEWLY added client component,
        # which is the worse direction to be wrong in: a green check on a
        # file nobody was checking. The count assertion below is what
        # stops this passing vacuously if the grep ever matches nothing.
        run: |
          set -euo pipefail
          found=0
          for src in src/*.tsx; do
            head -1 "$src" | grep -q '"use client"' || continue
            f="dist/$(basename "$src" .tsx).js"
            [ -f "$f" ] || { echo "$f missing, but its source is a client component"; exit 1; }
            head -1 "$f" | grep -q '"use client"' \
              || { echo "$f lost its \"use client\" directive"; exit 1; }
            echo "ok $f"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "no client components found in src/, so this check proved nothing"; exit 1; }
          echo "checked $found client components"
