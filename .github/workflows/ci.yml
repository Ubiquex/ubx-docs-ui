name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: No component carries a specific site's identity
        # Mechanical, because the per-component read-through that
        # preceded it caught GlobalSearch and missed Footer and
        # MobileSidebarToggle. See test/no-site-identity.test.mjs.
        run: npm test
      - run: npm run build
      - name: Confirm "use client" survives compilation
        # tsc has historically moved or dropped leading directives. If it
        # does, the client components silently become server components
        # and every consuming site breaks at runtime rather than at build
        # time, which is the worst place to find out.
        run: |
          set -euo pipefail
          for f in ThemeToggle GlobalSearch MobileSidebarToggle; do
            head -1 "dist/$f.js" | grep -q '"use client"' \
              || { echo "dist/$f.js lost its \"use client\" directive"; exit 1; }
            echo "ok $f"
          done
